# smartd configuration
# Auto-discover all drives (both NVMe SSDs), monitor all SMART attributes,
# and on any health warning run the desktop-notification bridge instead of mail.
#   -a               monitor everything (health, attributes, error counts)
#   -n standby,q     don't wake sleeping drives just to poll them
#   -m <nomailer>    no email; required so -M exec can take over
#   -M exec ...      run this script on warnings
#   -M daily         re-warn once a day while a problem persists
DEVICESCAN -a -n standby,q -m <nomailer> -M exec /usr/local/bin/smartd-notify.sh -M daily
