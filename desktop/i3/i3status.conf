# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 5
}

order += "read_file REC"
order += "read_file REC_PAUSED"
order += "ipv6"
order += "wireless _first_"
order += "ethernet _first_"
order += "read_file power"
order += "read_file netspeed"
order += "read_file share"
order += "path_exists VPN"
order += "read_file Tor"
order += "read_file iploc"
#order += "battery all"
order += "disk /"
order += "load"
order += "memory"
order += "tztime local"
order += "read_file LANG"

#new
order += "volume master"
order += "read_file battery"
order += "read_file GPU"



wireless _first_ {
        format_up = "W: (%quality at %essid) %ip"
        format_down = "W: down"
}

ethernet _first_ {
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

#battery all {
#        format = "%status %percentage %remaining"
#}

disk "/" {
        format = "%avail"
}

load {
        format = "%1min"
}

memory {
        format = "%used | %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}

read_file power {
    path = "/tmp/power_profile.txt"
    format = "Power: %content"
    format_bad = "Power: Bal"
}

read_file netspeed {
    path = "/tmp/netspeed.txt"
    format = "%content"
    format_bad = "↓0K ↑0K"
}

read_file share {
    path = "/tmp/share.txt"
    format = "%content"
    format_bad = "SHR: off"
}

path_exists VPN {
    path = "/proc/sys/net/ipv4/conf/tun0"
    format = "VPN: UP"
    format_down = "VPN: OFF"
}

read_file Tor {
    path = "/tmp/torstatus.txt"
    format = "%content"
    format_bad = "Tor: OFF"
}

read_file iploc {
    path = "/tmp/iploc.txt"
    format = "%content"
    format_bad = " Offline"
}



#New implementations

read_file LANG {
    path   = "/tmp/xkb_layout"
    format = "⌨ %content"
}

volume master {
    format       = "♪ %volume"
    format_muted = "♪ muted"
    device       = "default"
    mixer        = "Master"
    mixer_idx    = 0
}

# BAT0 firmware exposes only energy_now (no energy_full/capacity), so the
# built-in battery block divided by -1 and printed a huge negative %.
# Percentage now computed by ~/.local/bin/battery-monitor.sh into /tmp/battery.
