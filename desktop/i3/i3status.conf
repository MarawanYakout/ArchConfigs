read_file battery {
    path       = "/tmp/battery"
    format     = "%content"
    format_bad = " No battery"
}

read_file GPU {
    path   = "/tmp/gpu_usage"
    format = "GPU %content"
}

# Screen recorder (~/.local/bin/screen-recorder.sh): the files only exist while
# recording, so the blocks are hidden otherwise.
read_file REC {
    path       = "/run/user/1000/screen-recorder-1000/bar-rec"
    format     = "%content"
    format_bad = ""
    color_good = "#FF5555"
}

read_file REC_PAUSED {
    path       = "/run/user/1000/screen-recorder-1000/bar-paused"
    format     = "%content"
    format_bad = ""
    color_good = "#F1FA8C"
}
