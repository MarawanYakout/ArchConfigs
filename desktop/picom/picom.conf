# --- Rendering Backend ---
# Use OpenGL for smooth, hardware-accelerated rendering
backend = "glx";
vsync = true;
#glx-no-stencil = false;
#glx-copy-from-front = false;

# --- Fading Animations ---
# Smooth transitions when opening/closing windows or switching workspaces
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Transparency & Opacity ---
active-opacity = 1.0;
inactive-opacity = 1.0;

# Custom opacity rules for specific apps
# This makes Alacritty and Emacs slightly transparent, but keeps web browsers solid
opacity-rule = [
    "95:class_g = 'Alacritty' && focused",
    "85:class_g = 'Alacritty' && !focused",
    "95:class_g = 'Emacs'"
    #"100:class_g = 'Brave-browser'",
    #"100:class_g = 'Firefox'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

# Don't draw shadows on the polybar or the background
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'feh'",
    "class_g = 'Handy'"
];

# --- Corners ---
# Optional: Gives your windows a slight modern curve
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Handy'"
];

animations = ({
    triggers = ["open"];
    preset = "appear";
    duration = 0.15;
    scale = 0.85;
}, {
    triggers = ["close"];
    preset = "disappear";
    duration = 0.12;
    scale = 0.85;
}, {
    triggers = ["show"];
    preset = "slide-in";
    direction = "down";
    duration = 0.15;
}, {
    triggers = ["hide"];
    preset = "slide-out";
    direction = "down";
    duration = 0.12;
});

# Animate window geometry changes (moving/resizing/swapping)
move-delta = 10;
